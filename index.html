<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Live Streams & Webcams</title>
    
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- HLS.js for native IP camera streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- 3D Map Container -->
    <div id="map"></div>

    <!-- UI Overlay: Header -->
    <header class="glass-header">
        <h1><i class="fa-solid fa-earth-americas"></i> Live Earth Explorer</h1>
        <p>Discover real-time webcams and streams around the globe.</p>
    </header>

    <!-- Stream Viewer Modal -->
    <div id="stream-viewer-modal" class="modal hidden">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <div class="stream-info">
                    <h2 id="stream-title">Stream Title</h2>
                    <p id="stream-location"><i class="fa-solid fa-location-dot"></i> Location</p>
                </div>
                <button id="close-modal" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="video-container">
                <iframe id="video-frame" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="display: none;"></iframe>
                <video id="hls-player" controls autoplay muted style="display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; background: #000;"></video>
                <video id="mp4-player" controls autoplay muted loop style="display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; background: #000;"></video>
                <img id="mjpeg-player" src="" alt="Live Traffic Feed" style="display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; object-fit: contain; background: #000;" />
            </div>
        </div>
    </div>

    <!-- Custom Logic -->
    <script src="app.js"></script>
</body>
</html>
